name: publish

# Publishes @hanzo/skill when the version in package.json changes on main.
# A version already on the registry is skipped, so re-runs are safe.

on:
  push:
    branches: [main]
    paths: ['package.json']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: hanzo-build-linux-amd64
    steps:
      - uses: actions/checkout@v4

      # The registry is .npmrc's to name, not this file's — one place decides
      # where our packages live, and it is the same one a developer's `npm
      # install` reads.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://pkg.hanzo.ai/

      - name: Skip if already published
        id: check
        run: |
          NAME=$(jq -r .name package.json)
          VER=$(jq -r .version package.json)
          if curl -fsSL "https://pkg.hanzo.ai/$NAME/$VER" > /dev/null 2>&1; then
            echo "$NAME@$VER is already on the registry; skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # `test` builds dist/ and then runs the suite — one command for both.
      # dist/ is gitignored, so publishing without building ships a package
      # whose every entry point 404s.
      - name: Test
        if: steps.check.outputs.skip != 'true'
        run: |
          npm ci
          npm test

      # The token lives in KMS, which is where our credentials live; the only
      # thing CI holds is a machine identity to ask with.
      - name: Read the publish token
        if: steps.check.outputs.skip != 'true'
        env:
          KMS_CLIENT_ID: ${{ secrets.KMS_CLIENT_ID }}
          KMS_CLIENT_SECRET: ${{ secrets.KMS_CLIENT_SECRET }}
          KMS_ENDPOINT: ${{ vars.KMS_ENDPOINT || 'https://kms.hanzo.ai' }}
          KMS_SECRET_ENV: ${{ vars.KMS_SECRET_ENV || 'prod' }}
        run: |
          # An absent secret reads as the empty string rather than an error, so
          # each step below says which credential was missing instead of letting
          # the publish go anonymous and blaming the registry.
          if [ -z "$KMS_CLIENT_ID" ] || [ -z "$KMS_CLIENT_SECRET" ]; then
            echo "::error::KMS machine identity absent. Seed KMS_CLIENT_ID/KMS_CLIENT_SECRET as git.hanzo.ai Actions secrets."
            exit 1
          fi
          TOKEN=$(curl -fsS "$KMS_ENDPOINT/v1/kms/auth/login" -H 'Content-Type: application/json' \
            -d "{\"clientId\":\"$KMS_CLIENT_ID\",\"clientSecret\":\"$KMS_CLIENT_SECRET\"}" \
            | jq -r '.accessToken // empty')
          if [ -z "$TOKEN" ]; then
            echo "::error::KMS login failed at $KMS_ENDPOINT/v1/kms/auth/login."
            exit 1
          fi
          # NPM_TOKEN sits at the org root, so there is no path segment. The read
          # is org-scoped by the token's owner claim.
          VAL=$(curl -sS "$KMS_ENDPOINT/v1/kms/secrets/NPM_TOKEN?env=$KMS_SECRET_ENV" \
            -H "Authorization: Bearer $TOKEN" | jq -r '.value // empty')
          if [ -z "$VAL" ]; then
            echo "::error::KMS holds no NPM_TOKEN for env $KMS_SECRET_ENV, so nothing was published."
            exit 1
          fi
          echo "::add-mask::$VAL"
          echo "NODE_AUTH_TOKEN=$VAL" >> "$GITHUB_ENV"

      - name: Publish
        if: steps.check.outputs.skip != 'true'
        run: npm publish --access public --no-provenance
